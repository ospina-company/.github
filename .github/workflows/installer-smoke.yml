name: Installer smoke test

# This repo is public, so Actions minutes here are free and unlimited. That is
# the only reason we can afford to test on a real Windows runner at all.
on:
  push:
    paths: [ 'install.ps1', 'install.sh', 'preflight.ps1', '.github/workflows/installer-smoke.yml' ]
  pull_request:
    paths: [ 'install.ps1', 'install.sh', 'preflight.ps1', '.github/workflows/installer-smoke.yml' ]
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse install.ps1 with the real PowerShell parser
        shell: powershell
        run: |
          $errors = $null
          foreach ($f in @('install.ps1','preflight.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
                      (Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::$f : $($_.Message) at line $($_.Extent.StartLineNumber)" }
              exit 1
            }
            Write-Host "$f parses cleanly under PowerShell $($PSVersionTable.PSVersion)"
          }

      - name: PSScriptAnalyzer
        shell: powershell
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          # -Path binds a single string. Passing two silently analyses nothing,
          # and continue-on-error would hide that.
          foreach ($f in @('install.ps1','preflight.ps1')) {
            Write-Host "--- $f"
            Invoke-ScriptAnalyzer -Path $f -Severity Error,Warning |
              Format-Table -AutoSize | Out-String | Write-Host
          }

      - name: Helper functions behave on real Windows
        shell: powershell
        run: |
          # Pull the function definitions out via the AST. String matching breaks
          # here because the file is LF and [Environment]::NewLine is CRLF.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path install.ps1), [ref]$null, [ref]$null)
          $fns = $ast.FindAll({
            $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst]
          }, $true)
          Write-Host "loading $($fns.Count) function definitions"
          $OSPINA_HALT = '[ospina-halt] '
          foreach ($f in $fns) { Invoke-Expression $f.Extent.Text }

          Refresh-Path
          if (-not $env:Path) { Write-Host "::error::Refresh-Path produced an empty PATH"; exit 1 }
          Write-Host "Refresh-Path ok"

          $bash = Find-GitBash
          if (-not $bash) { Write-Host "::error::Find-GitBash found nothing on a runner that has Git"; exit 1 }
          Write-Host "Find-GitBash -> $bash"
          & $bash -c "echo bash works: \$(uname -s)"

          $nodeMajor = Get-NodeMajor
          if ($nodeMajor -notmatch '^[0-9]+$') {
            Write-Host "::error::Get-NodeMajor returned '$nodeMajor'"; exit 1
          }
          $pythonMinor = Get-PythonMinor
          if ($pythonMinor -notmatch '^[0-9]+\.[0-9]+$') {
            Write-Host "::error::Get-PythonMinor returned '$pythonMinor'"; exit 1
          }
          Write-Host "native version probes work: Node $nodeMajor, Python $pythonMinor"

          # The runner's inherited Node version is not the installer's contract.
          # Feed the parsers the exact required outputs as a controlled test.
          function Invoke-Native-Capture {
            param([string]$Exe, [string[]]$Arguments = @())
            if ($Exe -eq 'node') { return 'v24.19.0' }
            if ($Exe -eq 'python') { return 'Python 3.12.10' }
            return $null
          }
          if ((Get-NodeMajor) -ne '24') {
            Write-Host "::error::Get-NodeMajor did not recognize the required Node 24 output"; exit 1
          }
          if ((Get-PythonMinor) -ne '3.12') {
            Write-Host "::error::Get-PythonMinor did not recognize the required Python 3.12 output"; exit 1
          }
          Write-Host "exact Node 24 / Python 3.12 parsing works"

          # cmd.exe searches the current directory before PATH. Prove the helper
          # selects npm.cmd beside the active node.exe and ignores a malicious
          # same-name file in the checkout.
          $trustedDir = Join-Path $env:RUNNER_TEMP 'trusted-node'
          $untrustedDir = Join-Path $env:RUNNER_TEMP 'untrusted-checkout'
          New-Item -ItemType Directory -Force -Path $trustedDir,$untrustedDir | Out-Null
          Copy-Item (Join-Path $env:SystemRoot 'System32\cmd.exe') (Join-Path $trustedDir 'node.exe')
          Set-Content -Path (Join-Path $trustedDir 'npm.cmd') -Value '@echo trusted-npm' -Encoding ASCII
          Set-Content -Path (Join-Path $untrustedDir 'npm.cmd') -Value '@echo MALICIOUS-NPM' -Encoding ASCII
          $env:Path = "$trustedDir;$env:Path"
          Push-Location $untrustedDir
          try {
            $npm = Get-NodeToolPath 'npm'
            if ($npm -ne (Join-Path $trustedDir 'npm.cmd')) {
              Write-Host "::error::trusted npm resolver returned '$npm'"; exit 1
            }
            $npmOut = (& $npm --version | Out-String).Trim()
            if ($npmOut -ne 'trusted-npm') {
              Write-Host "::error::absolute npm invocation returned '$npmOut'"; exit 1
            }
          } finally { Pop-Location }
          Write-Host "Node tooling ignores current-directory command hijacks"

          # Simulate an old uv winning on PATH while a current user-scoped
          # WinGet package is present. Resolve-UvOnPath must select and prepend
          # the capability-verified executable.
          $savedPath = $env:Path
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedUserPath = [Environment]::GetEnvironmentVariable('Path','User')
          $uvRoot = Join-Path $env:RUNNER_TEMP 'uv-path-fixture'
          $oldUvDir = Join-Path $uvRoot 'old'
          $newUvDir = Join-Path $uvRoot 'localapp\Microsoft\WinGet\Packages\astral-sh.uv_fixture'
          New-Item -ItemType Directory -Force -Path $oldUvDir,$newUvDir | Out-Null
          Set-Content -Path (Join-Path $oldUvDir 'uv.cmd') -Value '@echo old-uv-help' -Encoding ASCII
          $uvSource = @'
          using System;
          public class UvFixture {
            public static int Main(string[] args) {
              Console.WriteLine("  --default");
              return 0;
            }
          }
          '@
          Add-Type -TypeDefinition $uvSource -Language CSharp `
                   -OutputAssembly (Join-Path $newUvDir 'uv.exe') -OutputType ConsoleApplication
          try {
            $env:LOCALAPPDATA = Join-Path $uvRoot 'localapp'
            $env:Path = "$oldUvDir;$savedPath"
            if (Test-UvDefaultInstall) {
              Write-Host "::error::old uv fixture was accepted"; exit 1
            }
            if (-not (Resolve-UvOnPath) -or -not (Test-UvDefaultInstall)) {
              Write-Host "::error::current user-scoped uv did not replace the old PATH winner"; exit 1
            }
            if ((Get-Command uv.exe).Source -ne (Join-Path $newUvDir 'uv.exe')) {
              Write-Host "::error::verified uv directory was not moved to the front of PATH"; exit 1
            }
            Refresh-Path -MachinePath $oldUvDir -UserPath $newUvDir
            if ((Get-Command uv.exe).Source -ne (Join-Path $newUvDir 'uv.exe')) {
              Write-Host "::error::PATH refresh restored the obsolete machine-scoped uv"; exit 1
            }
          } finally {
            $env:Path = $savedPath
            $env:LOCALAPPDATA = $savedLocalAppData
            [Environment]::SetEnvironmentVariable('Path', $savedUserPath, 'User')
          }
          Write-Host "old uv PATH conflict recovers to the current user-scoped executable"

          # LibreOffice is machine-scoped. A denied installation must return a
          # false capability result rather than throwing and aborting onboarding.
          function Have { param($c) return $false }
          function Resolve-OnPath { param($Command,$Directories) return $false }
          function Invoke-Native { param($Exe,$Arguments,[switch]$Interactive) return 7 }
          function Refresh-Path { }
          function Say { param($m,$ForegroundColor) }
          $script:OspinaLibreOfficeExitCode = 0
          if (Ensure-LibreOffice) {
            Write-Host "::error::failed LibreOffice fixture reported success"; exit 1
          }
          if ($script:OspinaLibreOfficeExitCode -ne 7) {
            Write-Host "::error::LibreOffice failure code was not preserved"; exit 1
          }
          Write-Host "machine-scope LibreOffice denial remains a non-fatal capability gap"

      - name: Preflight detects inherited applications and Store scope
        shell: powershell
        run: |
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path preflight.ps1), [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({
            $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst]
          }, $true)) { Invoke-Expression $f.Extent.Text }

          $fixture = Join-Path $env:RUNNER_TEMP 'preflight-fixture'
          $savedProgramFiles = $env:ProgramFiles
          $savedLocalAppData = $env:LOCALAPPDATA
          $savedUserProfile = $env:USERPROFILE
          try {
            $env:ProgramFiles = Join-Path $fixture 'Program Files'
            $env:LOCALAPPDATA = Join-Path $fixture 'User\AppData\Local'
            $env:USERPROFILE = Join-Path $fixture 'User'
            $lo = Join-Path $env:ProgramFiles 'LibreOffice\program\soffice.exe'
            $t3 = Join-Path $env:LOCALAPPDATA 'Programs\T3 Code'
            New-Item -ItemType Directory -Force -Path (Split-Path $lo -Parent),$t3 | Out-Null
            New-Item -ItemType File -Force -Path $lo | Out-Null
            if ((Get-LibreOfficePath) -ne $lo) {
              Write-Host "::error::preflight missed an inherited LibreOffice installation"; exit 1
            }
            if ((Get-T3CodePath) -ne $t3) {
              Write-Host "::error::preflight missed an inherited T3 Code installation"; exit 1
            }

            $storeAlias = Join-Path $env:USERPROFILE 'AppData\Local\Microsoft\WindowsApps\python.exe'
            function Test-StorePythonPackage { return $true }
            if (-not (Test-IsUserScopedTool 'python' $storeAlias)) {
              Write-Host "::error::a confirmed per-user Store Python was labeled machine-wide"; exit 1
            }
            function Test-StorePythonPackage { return $false }
            if (Test-IsUserScopedTool 'python' $storeAlias) {
              Write-Host "::error::an empty Windows Store alias was labeled user-installed"; exit 1
            }
          } finally {
            $env:ProgramFiles = $savedProgramFiles
            $env:LOCALAPPDATA = $savedLocalAppData
            $env:USERPROFILE = $savedUserProfile
          }
          Write-Host "preflight application and Store-scope fixtures pass"

      - name: Native stderr does not kill the script (regression)
        shell: powershell
        run: |
          # The bug this guards: PowerShell 5.1 converts native stderr into an
          # error record, and under $ErrorActionPreference='Stop' that terminates
          # the script. `gh auth status` on a machine that is NOT logged in
          # writes to stderr and exits non-zero, which is an answer rather than a
          # failure. CI missed it originally because the runner is authenticated.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path install.ps1), [ref]$null, [ref]$null)
          $fns = $ast.FindAll({
            $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst]
          }, $true)
          # Die references $OSPINA_HALT, which lives outside any function.
          $OSPINA_HALT = '[ospina-halt] '
          foreach ($f in $fns) { Invoke-Expression $f.Extent.Text }

          $ErrorActionPreference = 'Stop'

          # A native command that writes to stderr and exits non-zero.
          $rc = Invoke-Native cmd @('/c','echo boom 1>&2 & exit 3')
          if ($rc -ne 3) { Write-Host "::error::expected exit 3, got $rc"; exit 1 }
          Write-Host "Invoke-Native survived native stderr, returned $rc"

          # The real case: gh with no credentials at all.
          $env:GH_TOKEN = ''
          $env:GITHUB_TOKEN = ''
          $env:GH_CONFIG_DIR = (Join-Path $env:RUNNER_TEMP 'empty-gh')
          New-Item -ItemType Directory -Force -Path $env:GH_CONFIG_DIR | Out-Null
          $rc = Invoke-Native gh @('auth','status')
          if ($rc -eq 0) { Write-Host "::warning::gh still authenticated; weaker assertion" }
          Write-Host "unauthenticated gh auth status returned $rc without terminating"

          $out = Invoke-Native-Capture cmd @('/c','echo hello')
          if ($out -ne 'hello') { Write-Host "::error::capture returned '$out'"; exit 1 }
          Write-Host "Invoke-Native-Capture returned '$out'"

      - name: Structural guards for known regressions
        shell: powershell
        run: |
          $src = Get-Content install.ps1 -Raw
          $fail = 0

          # npm.ps1 is blocked by the default execution policy, while cmd /c
          # searches the current checkout first. Resolve the trusted .cmd by
          # absolute path beside node.exe instead.
          if ($src -match "cmd @\('/c','(npm|corepack)'" -or
              $src -notmatch 'Get-NodeToolPath') {
            Write-Host "::error::npm/corepack must use an absolute .cmd resolved from the active Node installation"
            $fail = 1
          }

          # Installing an optional agent must not be able to abort the run.
          $agentBlock = [regex]::Match($src, '(?s)foreach \(\$a in \$agents\).*?\n\}')
          if (-not $agentBlock.Success) {
            Write-Host "::error::could not find the agent loop to check"; $fail = 1
          } elseif ($agentBlock.Value -notmatch 'try\s*\{' -or $agentBlock.Value -notmatch 'catch\s*\{') {
            Write-Host "::error::the agent install loop has no try/catch; one failing agent would abort the whole setup"
            $fail = 1
          } else {
            Write-Host "agent loop is guarded by try/catch"
          }

          # exit inside an iex-delivered script closes the user's window.
          $bad = Select-String -Path install.ps1 -Pattern '^\s*exit\b' -AllMatches
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error::bare exit at line $($_.LineNumber) closes the user's PowerShell window under iex" }
            $fail = 1
          } else { Write-Host "no bare exit calls" }

          # Terminal output must be ASCII: PS 5.1's console codepage mangles UTF-8.
          foreach ($f in @('install.ps1','preflight.ps1')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($bytes | Where-Object { $_ -gt 127 }) {
              Write-Host "::error::$f contains non-ASCII bytes, which PowerShell 5.1 renders as mojibake"
              $fail = 1
            }
          }
          # An agent must be reported installed only when it is actually
          # callable. Trusting the installer's exit code produced a false
          # "installed" that made the next run ask again with no explanation.
          if ($src -match '\$okAgent\s+-or\s+\(&\s*\$a\.Test\)') {
            Write-Host "::error::agent success is inferred from the installer exit code; verify with the Test block instead"
            $fail = 1
          } else { Write-Host "agent success is verified, not assumed" }

          # Presence is not usability. npm resolves to npm.ps1, which the default
          # Restricted policy refuses to run, so Get-Command finding it proves
          # nothing about whether it works.
          # Negative lookbehind: "elseif (Have npm)" is the legitimate branch that
          # detects npm present-but-broken. Only a bare "if (Have npm)" gate is wrong.
          if ($src -match '(?<!else)if \(Have npm\)') {
            Write-Host "::error::npm is gated on Have npm; use the functional Test-Npm check instead"
            $fail = 1
          } else { Write-Host "npm is checked functionally" }

          # The machine baseline is contractual. These package IDs are the
          # cross-platform capabilities that make T3 and artifact work usable.
          foreach ($required in @('OpenJS.NodeJS.LTS','astral-sh.uv',
                                   'oschwartz10612.Poppler',
                                   'TheDocumentFoundation.LibreOffice',
                                   'T3Tools.T3Code')) {
            if ($src -notmatch [regex]::Escape($required)) {
              Write-Host "::error::missing required package $required"
              $fail = 1
            }
          }
          if ($src -match 'api.github.com/repos/pingdotgg/t3code/releases/latest') {
            Write-Host "::error::T3 Code must use its official winget package, not scrape latest release assets"
            $fail = 1
          }
          if ($src -notmatch 'https://chatgpt.com/codex/install.ps1') {
            Write-Host "::error::Codex must use OpenAI's official Windows installer"
            $fail = 1
          }
          if ($src -notmatch '\$NodeVersion = ''24\.19\.0''') {
            Write-Host "::error::Windows Node must stay pinned to the reviewed 24.x Winget version"
            $fail = 1
          }
          if ($src -notmatch 'Test-UvDefaultInstall') {
            Write-Host "::error::the installer must reject or upgrade uv versions without --default support"
            $fail = 1
          }
          $shellSrc = Get-Content install.sh -Raw
          foreach ($digest in @(
            '12479a24be3f5307eecac7cde670fad7118640f031229e964f544b1367b52a41',
            '391f247de2c70c7e99041979ec02dae7e76be27ac9cfc1dfe7c1eb21d48d8b97')) {
            if ($src -notmatch $digest -and $shellSrc -notmatch $digest) {
              Write-Host "::error::missing reviewed installer digest $digest"
              $fail = 1
            }
          }
          if ($shellSrc -match 'Homebrew/install/HEAD/install\.sh') {
            Write-Host "::error::Homebrew installer must use a reviewed immutable revision"
            $fail = 1
          }
          $wingetBuilders = [regex]::Matches(
            $src, "(?s)(?:@\(|= @\()'(?:install|upgrade)'.{0,450}?\)")
          foreach ($builder in $wingetBuilders) {
            if ($builder.Value -match "--id" -and
                $builder.Value -notmatch "'--source','winget'") {
              Write-Host "::error::WinGet package arguments are not pinned to the reviewed winget source: $($builder.Value)"
              $fail = 1
            }
          }
          if ($src -match "Invoke-Native-Capture node @\('-p'" -or
              $src -match "Invoke-Native-Capture python @\('-c'") {
            Write-Host "::error::PowerShell 5.1 strips embedded quotes from native expression arguments; parse --version output instead"
            $fail = 1
          }

          $preflight = Get-Content preflight.ps1 -Raw
          if ($preflight -notmatch 'Have-UsablePython') {
            Write-Host "::error::preflight must distinguish Microsoft Store aliases from usable Python"
            $fail = 1
          }
          foreach ($detector in @('Get-LibreOfficePath','Get-T3CodePath',
                                   'Test-IsUserScopedTool','Test-StorePythonPackage')) {
            if ($preflight -notmatch $detector) {
              Write-Host "::error::preflight does not mirror installer detection through $detector"
              $fail = 1
            }
          }

          # Every installer invocation must be visible. Hiding subprocess output
          # is what made a working install look like a hang on a bare machine.
          foreach ($m in [regex]::Matches($src, 'Invoke-Native winget @\([^)]*\)(?<tail>[^\r\n]*)')) {
            if ($m.Groups['tail'].Value -notmatch '-Interactive') {
              Write-Host "::error::a winget install does not stream its output; add -Interactive"
              $fail = 1
            }
          }
          if (-not $fail) { Write-Host "all winget installs stream their output" }

          # PowerShell executes function definitions in order, so a helper
          # defined below the code that calls it does not exist yet. A partner
          # hit exactly this: Ask-YesNo was called before its definition and the
          # run died mid-way. Every function must be defined before the wrapper.
          $ast2 = [System.Management.Automation.Language.Parser]::ParseFile(
                    (Resolve-Path install.ps1), [ref]$null, [ref]$null)
          $wrapper = $ast2.FindAll({
            $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $args[0].Name -eq 'Invoke-OspinaInstall' }, $true) | Select-Object -First 1
          if ($wrapper) {
            $late = $ast2.FindAll({
              $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) |
              Where-Object { $_.Name -ne 'Invoke-OspinaInstall' -and
                             $_.Extent.StartOffset -gt $wrapper.Extent.StartOffset }
            if ($late) {
              $late | ForEach-Object {
                Write-Host "::error::function $($_.Name) is defined after Invoke-OspinaInstall; hoist it above the wrapper"
              }
              $fail = 1
            } else { Write-Host "all helpers are defined before the wrapper" }
          }

          # Windows PowerShell 5.x renders a progress bar per chunk, costing
          # roughly 10x on a large download. Every fetch must go through
          # Get-RemoteFile, which suppresses it and reports progress itself.
          # Count invocations, not mentions. An earlier version of this guard
          # matched the word inside its own explanatory comment.
          $iwrLines = Get-Content install.ps1 |
                      Where-Object { $_ -notmatch '^\s*#' -and $_ -match 'Invoke-WebRequest' }
          if ($iwrLines.Count -ne 1) {
            Write-Host "::error::found $($iwrLines.Count) Invoke-WebRequest calls; downloads must go through Get-RemoteFile"
            $iwrLines | ForEach-Object { Write-Host "::error::  $_" }
            $fail = 1
          } else { Write-Host "all downloads go through Get-RemoteFile" }

          if ($fail) { exit 1 }
          Write-Host "all structural guards passed"

      - name: Installer output reaches the console (regression)
        shell: powershell
        run: |
          # A partner on a bare machine stalled at "install gh" because winget's
          # output was piped to Out-Null: a working install and a hang looked
          # identical. Prove -Interactive actually streams.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                   (Resolve-Path install.ps1), [ref]$null, [ref]$null)
          $OSPINA_HALT = '[ospina-halt] '
          foreach ($f in $ast.FindAll({
            $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            Invoke-Expression $f.Extent.Text
          }

          $marker = 'OSPINA_STREAM_PROOF'
          $shown  = (Invoke-Native cmd @('/c', "echo $marker") -Interactive) 6>&1 |
                      Out-String
          # Capture what the console actually received.
          $tmp = Join-Path $env:RUNNER_TEMP 'stream.txt'
          Start-Transcript -Path $tmp | Out-Null
          $null = Invoke-Native cmd @('/c', "echo $marker") -Interactive
          $null = Invoke-Native cmd @('/c', "echo HIDDEN_$marker")
          Stop-Transcript | Out-Null
          $log = Get-Content $tmp -Raw

          if ($log -notmatch [regex]::Escape($marker)) {
            Write-Host "::error::-Interactive did not reach the console; installer output would be invisible"
            exit 1
          }
          if ($log -match ('HIDDEN_' + $marker)) {
            Write-Host "::error::non-interactive mode leaked output; the two modes are not distinct"
            exit 1
          }
          Write-Host "proved: -Interactive streams to the console, non-interactive does not"

      - name: Windows path conversion is correct
        shell: powershell
        run: |
          foreach ($p in @('C:\Ospina\handbook','D:\Users\carlo\Repositories\handbook')) {
            $drive = $p.Substring(0,1).ToLower()
            $rest  = $p.Substring(2) -replace '\\','/'
            $unix  = "/$drive$rest"
            Write-Host "$p -> $unix"
            if ($unix -notmatch '^/[a-z]/') { Write-Host "::error::bad conversion for $p"; exit 1 }
          }

      - name: bootstrap.sh Windows branch runs under Git Bash
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          # git writes progress to stderr, which PowerShell turns into error
          # records for native commands. Silence both streams and judge by the
          # filesystem instead.
          $ErrorActionPreference = 'Continue'
          cmd /c "git clone --depth 1 https://github.com/ospina-company/handbook.git `"$env:RUNNER_TEMP\hb`" >NUL 2>&1"
          if (-not (Test-Path "$env:RUNNER_TEMP\hb\bootstrap.sh")) {
            Write-Host "::notice::handbook is private and not readable with the default runner token, so the bootstrap step is skipped. install.ps1 itself is fully covered by the steps above."
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $unix = "/" + ($env:RUNNER_TEMP.Substring(0,1).ToLower()) + ($env:RUNNER_TEMP.Substring(2) -replace '\\','/')
          & $bash -lc "sh '$unix/hb/bootstrap.sh' --check --no-install --no-clone"

  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shellcheck + POSIX syntax
        run: |
          bash -n install.sh && echo "install.sh parses"
          # No installer may hide its output: on a bare machine that turns a
          # slow install into an apparent hang.
          if grep -nE '(brew install|npm install -g)[^|]*>/dev/null' install.sh; then
            echo "::error::an installer above hides its output; let it stream"
            exit 1
          fi
          echo "all installers in install.sh stream their output"
          sudo apt-get update -qq && sudo apt-get install -y shellcheck -qq
          shellcheck -S warning install.sh || true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse and guard the actual macOS path
        shell: bash
        run: |
          bash -n install.sh
          for required in 'node@24' 'corepack enable' 'uv python install 3.12' \
                          'brew install --cask libreoffice' 'pdftotext' \
                          'brew install --cask codex' 'brew install --cask t3-code' \
                          '/bin/bash "$_hb" </dev/tty'; do
            if ! grep -Fq "$required" install.sh; then
              echo "::error::macOS installer is missing required baseline: $required"
              exit 1
            fi
          done
          if grep -nE '(brew install|npm install -g)[^|]*>/dev/null' install.sh; then
            echo "::error::an installer above hides its output; let it stream"
            exit 1
          fi

      - name: macOS prerequisite and uv capability behavior
        shell: bash
        run: |
          set -euo pipefail
          eval "$(sed -n '/^add_path()/,/^}/p' install.sh)"
          eval "$(sed -n '/^persist_path_front()/,/^}/p' install.sh)"
          eval "$(sed -n '/^can_install_homebrew()/,/^}/p' install.sh)"
          eval "$(sed -n '/^uv_supports_default()/,/^}/p' install.sh)"
          have() { command -v "$1" >/dev/null 2>&1; }
          old_bin="$RUNNER_TEMP/ospina-mocks-old"
          new_bin="$RUNNER_TEMP/ospina-mocks-new"
          mkdir -p "$old_bin" "$new_bin"
          printf '#!/bin/sh\nprintf "staff\\n"\n' > "$old_bin/groups"
          printf '#!/bin/sh\nprintf "old uv help\\n"\n' > "$old_bin/uv"
          printf '#!/bin/sh\nprintf "  --default\\n"\n' > "$new_bin/uv"
          chmod +x "$old_bin/groups" "$old_bin/uv" "$new_bin/uv"
          PATH="$old_bin:$new_bin:$PATH"

          if can_install_homebrew; then
            echo "::error::a simulated non-admin account was allowed into Homebrew installation"
            exit 1
          fi
          if uv_supports_default; then
            echo "::error::old uv simulation was accepted"
            exit 1
          fi
          add_path "$new_bin"
          HOME="$RUNNER_TEMP/ospina-home"
          export HOME
          mkdir -p "$HOME"
          persist_path_front "$new_bin"
          uv_supports_default
          [ "$(command -v uv)" = "$new_bin/uv" ]
          resolved=$(PATH="$old_bin:$PATH" zsh -l -c 'command -v uv')
          [ "$resolved" = "$new_bin/uv" ]
          echo "non-admin guard and competing-old-uv recovery persist in a new login shell"
